# Conda env for the router jobs (jobs/*.json: "env": {"file": "env.yml"}).
# torch and the CUDA extensions are installed by env_post.sh (they need a specific index / prebuilt wheels).
name: recurrent_armt
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy<2.4
      - einops
      - packaging
      - ninja
      - transformers==5.20.2
      - huggingface_hub
      - safetensors
      - pyarrow
      - datasets
      - wandb
      - pytest
      - matplotlib
